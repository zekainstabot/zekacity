
      - name: Import Godot project
        shell: bash
        timeout-minutes: 10
        run: |
          set -uo pipefail

          IMPORT_LOG="$RUNNER_TEMP/godot-import.log"

          echo "Starting Godot import at $(date -u)"
          echo "Godot version:"
          "$GODOT_BIN" --version

          set +e
          timeout --signal=TERM --kill-after=15s 8m \
            "$GODOT_BIN" \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit \
            > "$IMPORT_LOG" 2>&1
          STATUS=$?
          set -e

          echo "Godot import exit code: $STATUS"
          echo "Import finished at $(date -u)"
          echo "----- GODOT IMPORT LOG -----"
          cat "$IMPORT_LOG"
          echo "----- END IMPORT LOG -----"

          if [ "$STATUS" -eq 124 ] || [ "$STATUS" -eq 137 ]; then
            echo "ERROR: Godot import timed out."
            exit 1
          fi

          if [ "$STATUS" -ne 0 ]; then
            echo "ERROR: Godot import exited with code $STATUS."
            exit "$STATUS"
          fi
