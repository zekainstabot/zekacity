name: Build ZekaCity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget zip

      - name: Download Godot 3.6.3
        shell: bash
        run: |
          set -euo pipefail

          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"

          wget -nv \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=x11.64.zip&version=3.6.3" \
            -O "$GODOT_DIR/godot.zip"

          unzip -o "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"

          GODOT_BIN="$GODOT_DIR/Godot_v3.6.3-stable_x11.64"

          if [ ! -f "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found."
            find "$GODOT_DIR" -maxdepth 2 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/templates/3.6.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          wget -nv \
            "https://github.com/godotengine/godot-builds/releases/download/3.6.3-stable/Godot_v3.6.3-stable_export_templates.tpz" \
            -O "$RUNNER_TEMP/templates.tpz"

          unzip -o "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"

          TEMPLATE_SOURCE="$RUNNER_TEMP/templates/templates"

          if [ ! -d "$TEMPLATE_SOURCE" ]; then
            echo "ERROR: Export templates folder not found."
            find "$RUNNER_TEMP/templates" -maxdepth 3 -type f
            exit 1
          fi

          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DIR/"

          echo "Installed export templates:"
          ls -lah "$TEMPLATE_DIR"

      - name: Prepare Android signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/debug.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "ANDROID_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg not found in repository root."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("export_presets.cfg")
          text = path.read_text(encoding="utf-8")

          sections = list(re.finditer(r"(?m)^\[preset\.\d+\]\s*$", text))
          android_section = None

          for i, match in enumerate(sections):
              end = sections[i + 1].start() if i + 1 < len(sections) else len(text)
              section = text[match.start():end]
              if re.search(r'(?m)^platform="Android"\s*$', section):
                  android_section = (match.start(), end, section)
                  break

          if android_section is None:
              raise SystemExit(
                  'ERROR: No Android export preset found in export_presets.cfg.'
              )

          start, end, section = android_section

          values = {
              "custom_template/release": "",
              "custom_template/debug": "",
              "keystore/debug": str(__import__("os").environ["ANDROID_KEYSTORE"]),
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          for key, value in values.items():
              line = f'{key}="{value}"'
              pattern = rf'(?m)^{re.escape(key)}=.*$'

              if re.search(pattern, section):
                  section = re.sub(pattern, lambda _: line, section)
              else:
                  section = section.rstrip() + "\n" + line + "\n"

          text = text[:start] + section + text[end:]
          path.write_text(text, encoding="utf-8")
          print("Android export preset configured.")
          PY

      - name: Import project resources
        shell: bash
        run: |
          set -uo pipefail

          IMPORT_LOG="$RUNNER_TEMP/godot-import.log"

          set +e
          timeout 240s "$GODOT_BIN" \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --headless \
            --import \
            --quit \
            > "$IMPORT_LOG" 2>&1
          IMPORT_EXIT=$?
          set -e

          cat "$IMPORT_LOG"

          if [ "$IMPORT_EXIT" -ne 0 ]; then
            echo "ERROR: Godot import failed or timed out. Exit code: $IMPORT_EXIT"
            exit "$IMPORT_EXIT"
          fi

      - name: Validate Android export preset
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --path "$GITHUB_WORKSPACE" \
            --headless \
            --export-debug \
            "Android" \
            "$RUNNER_TEMP/validation.apk" \
            2>&1 | tee "$RUNNER_TEMP/export-validation.log" || {
              echo "ERROR: Android export failed."
              exit 1
            }

          if [ ! -s "$RUNNER_TEMP/validation.apk" ]; then
            echo "ERROR: Godot did not produce an APK."
            exit 1
          fi

      - name: Copy APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          cp "$RUNNER_TEMP/validation.apk" \
            "$GITHUB_WORKSPACE/build/ZekaCity-Android.apk"

          ls -lh "$GITHUB_WORKSPACE/build/ZekaCity-Android.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZekaCity-Android-APK
          path: build/ZekaCity-Android.apk
          if-no-files-found: error
          retention-days: 14
