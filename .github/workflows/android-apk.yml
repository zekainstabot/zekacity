
name: Build ZekaCity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-22.04

    env:
      GODOT_SILENCE_ROOT_WARNING: "1"

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          sdkmanager --licenses </dev/null

      - name: Download Godot 3.6.3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/godot"

          wget -nv \
            "https://github.com/godotengine/godot-builds/releases/download/3.6.3-stable/Godot_v3.6.3-stable_linux_headless.64.zip" \
            -O "$RUNNER_TEMP/godot/godot.zip"

          unzip -o "$RUNNER_TEMP/godot/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot" \
            -type f \
            -name "Godot_v3.6.3-stable_linux_headless.64" \
            -print -quit)"

          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable was not found."
            find "$RUNNER_TEMP/godot" -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Install Android export templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_ROOT="$HOME/.local/share/godot/templates/3.6.3.stable"
          EXTRACT_DIR="$RUNNER_TEMP/export_templates"

          mkdir -p "$TEMPLATE_ROOT" "$EXTRACT_DIR"

          wget -nv \
            "https://github.com/godotengine/godot-builds/releases/download/3.6.3-stable/Godot_v3.6.3-stable_export_templates.tpz" \
            -O "$RUNNER_TEMP/export_templates.tpz"

          unzip -o "$RUNNER_TEMP/export_templates.tpz" \
            -d "$EXTRACT_DIR"

          SOURCE_TEMPLATES="$EXTRACT_DIR/templates"

          if [ ! -s "$SOURCE_TEMPLATES/android_debug.apk" ] || \
             [ ! -s "$SOURCE_TEMPLATES/android_release.apk" ]; then
            echo "ERROR: Android export templates are missing."
            find "$EXTRACT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          cp -a "$SOURCE_TEMPLATES/." "$TEMPLATE_ROOT/"

          test -s "$TEMPLATE_ROOT/android_debug.apk"
          test -s "$TEMPLATE_ROOT/android_release.apk"

          echo "Android export templates installed."

      - name: Validate project and Android preset
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot || {
            echo "ERROR: project.godot not found in repository root."
            exit 1
          }

          test -f export_presets.cfg || {
            echo "ERROR: export_presets.cfg not found in repository root."
            exit 1
          }

          grep -Eq '^[[:space:]]*name="Android"[[:space:]]*$' export_presets.cfg || {
            echo "ERROR: Android preset was not found."
            exit 1
          }

          grep -Eq '^[[:space:]]*platform="Android"[[:space:]]*$' export_presets.cfg || {
            echo "ERROR: Android platform setting was not found."
            exit 1
          }

          echo "Project and Android preset checks passed."

      - name: Import Godot project
        shell: bash
        run: |
          set -uo pipefail

          IMPORT_LOG="$RUNNER_TEMP/godot-import.log"

          set +e
          "$GODOT_BIN" \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --quit \
            > "$IMPORT_LOG" 2>&1
          IMPORT_STATUS=$?
          set -e

          cat "$IMPORT_LOG"

          if [ "$IMPORT_STATUS" -ne 0 ]; then
            echo "ERROR: Godot import exited with code $IMPORT_STATUS."
            exit "$IMPORT_STATUS"
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -uo pipefail

          OUTPUT_APK="$RUNNER_TEMP/ZekaCity.apk"
          EXPORT_LOG="$RUNNER_TEMP/godot-export.log"

          set +e
          "$GODOT_BIN" \
            --path "$GITHUB_WORKSPACE" \
            --export "Android" "$OUTPUT_APK" \
            > "$EXPORT_LOG" 2>&1
          EXPORT_STATUS=$?
          set -e

          cat "$EXPORT_LOG"

          if [ "$EXPORT_STATUS" -ne 0 ]; then
            echo "ERROR: Godot export exited with code $EXPORT_STATUS."
            exit "$EXPORT_STATUS"
          fi

          if [ ! -s "$OUTPUT_APK" ]; then
            echo "ERROR: APK export did not create a non-empty file."
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$OUTPUT_APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZekaCity-Android-APK
          path: ${{ runner.temp }}/ZekaCity.apk
          if-no-files-found: error
