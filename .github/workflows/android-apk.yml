name: Build ZekaCity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget zip python3 xvfb

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version
          keytool -help >/dev/null 2>&1

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Download Godot 3.6.3
        shell: bash
        run: |
          set -euo pipefail

          GODOT_DIR="$RUNNER_TEMP/godot"
          mkdir -p "$GODOT_DIR"

          wget -nv \
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=x11.64.zip&version=3.6.3" \
            -O "$GODOT_DIR/godot.zip"

          unzip -o "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"

          GODOT_BIN="$GODOT_DIR/Godot_v3.6.3-stable_x11.64"

          if [ ! -f "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found."
            find "$GODOT_DIR" -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Download Godot export templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/templates/3.6.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          wget -nv \
            "https://github.com/godotengine/godot-builds/releases/download/3.6.3-stable/Godot_v3.6.3-stable_export_templates.tpz" \
            -O "$RUNNER_TEMP/templates.tpz"

          unzip -o "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          TEMPLATE_SOURCE="$RUNNER_TEMP/templates/templates"

          if [ ! -d "$TEMPLATE_SOURCE" ]; then
            echo "ERROR: Export templates folder not found."
            find "$RUNNER_TEMP/templates" -maxdepth 3 -type f
            exit 1
          fi

          cp -a "$TEMPLATE_SOURCE/." "$TEMPLATE_DIR/"

          echo "Export templates installed:"
          ls -lah "$TEMPLATE_DIR"

      - name: Prepare Android signing key
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/debug.keystore"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "ANDROID_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Configure Android export preset
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("export_presets.cfg")
          text = path.read_text(encoding="utf-8")

          matches = list(
              re.finditer(r"(?m)^\[preset\.\d+\]\s*$", text)
          )

          for i, match in enumerate(matches):
              end = (
                  matches[i + 1].start()
                  if i + 1 < len(matches)
                  else len(text)
              )

              section = text[match.start():end]

              if not re.search(
                  r'(?m)^platform="Android"\s*$',
                  section
              ):
                  continue

              values = {
                  "keystore/debug": os.environ["ANDROID_KEYSTORE"],
                  "keystore/debug_user": "androiddebugkey",
                  "keystore/debug_password": "android",
              }

              for key, value in values.items():
                  line = f'{key}="{value}"'
                  pattern = rf'(?m)^{re.escape(key)}=.*$'

                  if re.search(pattern, section):
                      section = re.sub(
                          pattern,
                          lambda _: line,
                          section
                      )
                  else:
                      section = section.rstrip() + "\n" + line + "\n"

              text = text[:match.start()] + section + text[end:]
              path.write_text(text, encoding="utf-8")

              print("Android export preset configured.")
              break
          else:
              raise SystemExit(
                  "ERROR: No Android preset found in export_presets.cfg."
              )
          PY

      - name: Import project resources
        shell: bash
        run: |
          set -uo pipefail

          IMPORT_LOG="$RUNNER_TEMP/godot-import.log"

          set +e
          timeout 240s xvfb-run -a "$GODOT_BIN" \
            --path "$GITHUB_WORKSPACE" \
            --editor \
            --import \
            --quit \
            > "$IMPORT_LOG" 2>&1
          IMPORT_EXIT=$?
          set -e

          cat "$IMPORT_LOG"

          if [ "$IMPORT_EXIT" -ne 0 ]; then
            echo "ERROR: Godot import failed. Exit code: $IMPORT_EXIT"
            exit "$IMPORT_EXIT"
          fi

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build"

          APK_PATH="$GITHUB_WORKSPACE/build/ZekaCity-Android.apk"
          EXPORT_LOG="$RUNNER_TEMP/godot-export.log"

          set +e
          timeout 300s xvfb-run -a "$GODOT_BIN" \
            --path "$GITHUB_WORKSPACE" \
            --export-debug \
            "Android" \
            "$APK_PATH" \
            > "$EXPORT_LOG" 2>&1
          EXPORT_EXIT=$?
          set -e

          cat "$EXPORT_LOG"

          if [ "$EXPORT_EXIT" -ne 0 ]; then
            echo "ERROR: Android APK export failed."
            exit "$EXPORT_EXIT"
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZekaCity-Android-APK
          path: build/ZekaCity-Android.apk
          if-no-files-found: error
          retention-days: 14
